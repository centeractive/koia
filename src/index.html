<!doctype html>
<html>

<head>
  <style>
    #container {
      position: absolute;
      top: 0px;
      right: 0px;
      bottom: 0px;
      left: 0px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #292626;
    }

    #loader {
      border: 16px solid #ea8315;
      border-radius: 50%;
      border-top: 16px solid #ad1f1f;
      width: 40px;
      height: 40px;
      -webkit-animation: spin 2s linear infinite;
      /* Safari */
      animation: spin 2s linear infinite;
      margin-bottom: 10px;
    }

    /* Safari */
    @-webkit-keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>

  <script>
    // opens the intro in the language of the user (query parameter, last selected language, browser preferences)
    if (location.pathname === '/') {
      (function () {
        function supported(tag) {
          var l = String(tag || '').toLowerCase().split(/[-_]/)[0];
          return ['en', 'de', 'ja'].indexOf(l) >= 0 ? l : null;
        }
        var lang = supported(new URLSearchParams(location.search).get('lang'));
        if (lang) {
          try { localStorage.setItem('koia.language', lang); } catch (e) { }
        } else {
          try { lang = supported(localStorage.getItem('koia.language')); } catch (e) { }
        }
        var browser = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
        for (var i = 0; !lang && i < browser.length; i++) {
          lang = supported(browser[i]);
        }
        location.replace('/intro/index' + (lang && lang !== 'en' ? '.' + lang : '') + '.html' + location.hash);
      })();
    }
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-66X1MBQRD9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-66X1MBQRD9');
  </script>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="utf-8">
  <title>Koia Data Analysis</title>
  <meta name="description"
    content="Create pivot tables and dashboards from CSV, Excel or JSON data right in your browser. Open-source, no sign-up. Your data is never sent to any third-party server.">
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">

</head>

<body>
  <koia-root>
    <div id="container">
      <div style="color: white;">
        <div id="loader"></div>
        Loading Koia...
      </div>
    </div>
  </koia-root>
</body>

</html>
