<koia-page-frame [heading]="'scenes.title' | translate" [active]="route">
  <mat-card appearance="outlined" id="mat_card_scenes" koiaForm>
    <mat-card-content>
      <div id="div_filter" class="field-row">
        <mat-form-field class="filter">
          <mat-icon matPrefix>search</mat-icon>
          <input matInput type="text" [placeholder]="'scenes.filter' | translate" [(ngModel)]="filter" (ngModelChange)="onFilterChange()">
        </mat-form-field>
        <button id="but_delete_scenes" mat-stroked-button [disabled]="filteredSceneInfos.length === 0" (click)="onDeleteScenesButtonPressed()">
          <mat-icon>delete_forever</mat-icon>
          <span>&nbsp;{{ (filter ? 'scenes.deleteFiltered' : 'scenes.deleteAll') | translate }}</span>
        </button>
      </div>
      <koia-scene-table [sceneInfos]="filteredSceneInfos" [activeScene]="activeScene" (onActivate)="activate($event)"
        (onContinue)="showRawData()" (onDelete)="delete($event)"
        [existingSceneNames]="sceneNames" (onEdit)="updateLabels($event)">
      </koia-scene-table>
    </mat-card-content>
    <mat-card-actions>
      <button id="but_cancel" mat-flat-button color="primary" (click)="cancel()">{{ 'common.cancel' | translate }}</button>
    </mat-card-actions>
  </mat-card>
</koia-page-frame>
