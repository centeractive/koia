<button id="but_save_view" mat-icon-button [matTooltip]="'view.save' | translate" [disabled]="!ready" (click)="save()">
  <mat-icon>save_alt</mat-icon>
</button>
<button id="but_restore_view" class="but_more" mat-icon-button [matTooltip]="'view.restore' | translate"
  [disabled]="!ready || !savedViews.length" [matMenuTriggerFor]="restoreViewMenu">
  <mat-icon [matBadge]="savedViews.length" [matBadgeHidden]="!savedViews.length" matBadgeSize="small" matBadgeColor="accent">
    open_in_browser
  </mat-icon>
</button>
<mat-menu #restoreViewMenu="matMenu">
  @for (view of savedViews; track view) {
    <button class="menu_item_details" mat-menu-item (click)="restore(view)">
      <mat-icon>monitor</mat-icon>
      <span>{{ view.name }} <var>{{ view.modifiedTime | koiaDate:'short' }}</var></span>
    </button>
  }
  <button id="menuItemManageViews" mat-menu-item (click)="manage()">
    <mat-icon>settings</mat-icon>
    <span>{{ 'dialog.manageViews' | translate }}</span>
  </button>
</mat-menu>
