<mat-sidenav-container fullscreen>

  <mat-sidenav mode="push" class="sidenav" (openedStart)="onSidenavOpening()" (closedStart)="onSidenavClosing()">
    <koia-pivot-table-side-bar [columns]="columns" [context]="context" [data]="baseDataFrame" />
  </mat-sidenav>

  <mat-sidenav-content>
    <div #header class="div_header">
      <koia-main-toolbar [route]="route" [tabId]="tab?.id" [restoredQuery]="restoredQuery" (onFilterChange)="fetchData($event)" />
      @if (loading) {
        <mat-progress-bar mode="indeterminate" [matTooltip]="'pivot.loadingData' | translate" />
      }
      <koia-view-toolbar [moreMenu]="moreMenu">
        @if (allowsForValueGrouping) {
          <button id="but_value_grouping" class="but_config" mat-icon-button
            [matTooltip]="'pivot.defineValueGrouping' | translate" (click)="sidenav.open()">
            <mat-icon [matBadge]="context.valueGroupings.length" [matBadgeHidden]="context.valueGroupings.length === 0"
              matBadgeSize="small" matBadgeColor="accent">group_work</mat-icon>
          </button>
        }
        <button id="but_time_unit" class="but_config" mat-icon-button [matMenuTriggerFor]="timeColumnMenu"
          [matTooltip]="'pivot.timeUnitGrouping' | translate">
          <mat-icon>date_range</mat-icon>
        </button>
        <button id="but_row_totals" class="but_config" mat-icon-button [class.koia-toggle-active]="context.showRowTotals"
          [matTooltip]="(context.showRowTotals ? 'pivot.hideRowTotals' : 'pivot.showRowTotals') | translate"
          (click)="onShowRowTotalsChanged()">
          <mat-icon svgIcon="row_totals" />
        </button>
        <button id="but_column_totals" class="but_config" mat-icon-button [class.koia-toggle-active]="context.showColumnTotals"
          [matTooltip]="(context.showColumnTotals ? 'pivot.hideColumnTotals' : 'pivot.showColumnTotals') | translate"
          (click)="onShowColumnTotalsChanged()">
          <mat-icon svgIcon="column_totals" />
        </button>
        <button id="but_heatmap_colors" class="but_config" mat-icon-button [matMenuTriggerFor]="heatmapColorsMenu"
          [matTooltip]="'pivot.heatmapColors' | translate">
          <mat-icon>color_lens</mat-icon>
        </button>
      </koia-view-toolbar>
      <mat-menu #moreMenu="matMenu">
        <button mat-menu-item (click)="exportToExcel()">
          <mat-icon>insert_drive_file</mat-icon>
          <span>{{ 'pivot.saveAsExcel' | translate }}</span>
        </button>
      </mat-menu>

      <mat-menu #timeColumnMenu="matMenu">
        @for (column of timeColumns; track column) {
          <button mat-menu-item [matMenuTriggerFor]="timeUnitMenu"
          [matMenuTriggerData]="{ column: column }">{{ column.name }}</button>
        }
      </mat-menu>
      <mat-menu #timeUnitMenu="matMenu">
        <ng-template matMenuContent let-column="column">
          @for (timeUnit of timeUnits; track timeUnit) {
            <button mat-menu-item [disabled]="timeUnit === column.groupingTimeUnit"
            (click)="onTimeUnitChanged(column, timeUnit)">{{ 'pivot.timeUnit.' + timeUnit | translate }}</button>
          }
        </ng-template>
      </mat-menu>

      <mat-menu #heatmapColorsMenu="matMenu">
        <button mat-menu-item [matMenuTriggerFor]="colorsNegativeValsMenu">{{ 'pivot.negativeValues' | translate }}</button>
        <button mat-menu-item [matMenuTriggerFor]="colorsPositiveValsMenu">{{ 'pivot.positiveValues' | translate }}</button>
      </mat-menu>
      <mat-menu #colorsNegativeValsMenu="matMenu">
        @for (color of contextFactory.colors; track color) {
          <button mat-menu-item [disabled]="color === context.negativeColor"
            (click)="onNegativeColorChanged(color)">
            <span [class]="'span_color' + (color === context.negativeColor ? '_inactive' : '')"
            [ngStyle]="{'background-color':color}"></span>
          </button>
        }
      </mat-menu>
      <mat-menu #colorsPositiveValsMenu="matMenu">
        @for (color of contextFactory.colors; track color) {
          <button mat-menu-item [disabled]="color === context.positiveColor"
            (click)="onPositiveColorChanged(color)">
            <span [class]="'span_color' + (color === context.positiveColor ? '_inactive' : '')"
            [ngStyle]="{'background-color':color}"></span>
          </button>
        }
      </mat-menu>
      <koia-print-heading [title]="tab?.title" [sceneName]="scene?.name" />
    </div>

    <div #content class="div_content div_pivot_content" cdkScrollable>
      <div class="div_table">
        @if (computing) {
          <mat-progress-bar mode="indeterminate" color="accent"></mat-progress-bar>
        }
        <div class="printable" #pivot id="pivot"></div>
      </div>
    </div>

  </mat-sidenav-content>
</mat-sidenav-container>
