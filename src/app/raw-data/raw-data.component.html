<div class="div_wrapper">
  <div class="div_header">
    @if (!hideToolbar) {
      <koia-main-toolbar [class.dialog_top_row]="dialogStyle" [dialogStyle]="dialogStyle" [route]="route" [query]="query" [restoredQuery]="restoredQuery"
        (onFilterChange)="onFilterChanged($event)" />
    }
    @if (loading) {
      <mat-progress-bar mode="indeterminate" [matTooltip]="'rawData.loading' | translate" />
    }
    <koia-view-toolbar [class.dialog_top_row]="dialogStyle && hideToolbar" [moreMenu]="moreMenu" [persistable]="!dialogStyle" [savedViews]="configRecords" (save)="saveConfig()"
      (restore)="loadConfig($event)">
      <button mat-icon-button [class.koia-toggle-active]="considerColumnWidths"
        [matTooltip]="(considerColumnWidths ? 'rawData.ignoreColumnWidths' : 'rawData.observeColumnWidths') | translate"
        (click)="toggleConsiderColumnWidths()">
        <mat-icon>wrap_text</mat-icon>
      </button>
      @if (columns) {
        <koia-table-mode-toggles [columns]="columns" [multiLine]="multiLine" (multiLineChange)="toggleMultiLine()"
          [(showNestedObjects)]="showNestedObjects" />
      }
      <button mat-icon-button [class.koia-toggle-active]="highlight"
        [matTooltip]="(highlight ? 'rawData.undoHighlight' : 'rawData.highlight') | translate" (click)="toggleHighlight()">
        <mat-icon>highlight</mat-icon>
      </button>
    </koia-view-toolbar>
    <mat-menu #moreMenu="matMenu">
      @for (exportFormat of exportFormats; track exportFormat) {
        <button mat-menu-item (click)="saveAs(exportFormat)">
          <mat-icon>insert_drive_file</mat-icon>
          <span>{{ 'rawData.saveAs' | translate: { format: exportFormat } }}</span>
        </button>
      }
      @if (!dialogStyle) {
        <button mat-menu-item (click)="manageViews()" [disabled]="configRecords.length === 0">
          <mat-icon>monitor</mat-icon>
          <span>{{ 'rawData.manageViews' | translate }}</span>
        </button>
      }
    </mat-menu>
    @if (!dialogStyle) {
      <koia-print-heading [title]="'toolbar.tabs.rawData' | translate" [sceneName]="scene?.name" />
    }
  </div>

  @if (columns) {
    <koia-virtual-table [columns]="columns" [widths]="widths" [source]="source" [multiLine]="multiLine"
      [showNestedObjects]="showNestedObjects" [dialogStyle]="dialogStyle" [sortable]="true" [sortIndicatorOf]="sortIndicator"
      [rowStyleOf]="rowStyleOf" (sort)="sortBy($event)" (columnResize)="onColumnResize($event)" />
  }
</div>
