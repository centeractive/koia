<div class="view_toolbar">
  @if (moreMenu) {
    <button class="but_view_more" mat-icon-button [matMenuTriggerFor]="moreMenu" [attr.aria-label]="'common.more' | translate">
      <mat-icon>more_vert</mat-icon>
    </button>
  }
  @if (printable) {
    <button id="but_print" mat-icon-button [matTooltip]="'view.print' | translate" [disabled]="!hasContent" (click)="printView()">
      <mat-icon>print</mat-icon>
    </button>
  }
  <span class="koia-toolbar-separator"></span>
  <ng-content />
</div>
