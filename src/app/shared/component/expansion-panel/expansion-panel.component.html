<mat-expansion-panel [expanded]="expanded">
  <mat-expansion-panel-header>
    <mat-panel-title>{{ title }}</mat-panel-title>
    @if (deletable) {
      <mat-panel-description>
        <button class="but_delete_panel" mat-icon-button [matTooltip]="'common.delete' | translate" [attr.aria-label]="'common.delete' | translate"
          (click)="onDelete($event)" (keydown)="$event.stopPropagation()"><mat-icon>delete_forever</mat-icon></button>
      </mat-panel-description>
    }
  </mat-expansion-panel-header>
  <ng-content></ng-content>
</mat-expansion-panel>
