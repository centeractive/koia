<mat-card appearance="outlined">

  <mat-card-header>
    <mat-card-title>{{ 'dialog.manageViews' | translate }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <h4>{{ 'dialog.manageSavedViews' | translate }}</h4>
    <p>{{ 'dialog.manageSavedViewsHint' | translate }}</p>
    <div id="div_config_records">
      @for (item of items; track item; let i = $index) {
        @if (!item.deleted) {
          <div class="div_row">
            <button [id]="'butDelete-' + i" mat-icon-button (click)="deleteItem(item)">
              <mat-icon>delete_forever</mat-icon>
            </button>
            <mat-icon>monitor</mat-icon>&nbsp;
            <input [(ngModel)]="item.configRecord.name" (ngModelChange)="onChange()" required
              [maxlength]="viewNameMaxLength" />
              <var>{{ item.configRecord.modifiedTime | koiaDate:'short' }}</var>
            </div>
          }
        }
      </div>
      <div id="div_buttons">
        <button id="but_cancel" mat-raised-button [color]="changed ? null : 'primary'"
        (click)="dialogRef.close()">{{ 'common.cancel' | translate }}</button>
        <button id="but_ok" mat-raised-button [color]="changed ? 'primary' : null" [disabled]="!changed"
        (click)="butOkPressed()">{{ 'common.ok' | translate }}</button>
      </div>
    </mat-card-content>
  </mat-card>
