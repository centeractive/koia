trigger: none

schedules:
- cron: "0 5 * * Mon-Fri"
  displayName: M-F daily 5am build
  branches:
    include:
    - master

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm
  NODE_OPTIONS: --max_old_space_size=4096

pool:
  vmImage: ubuntu-latest

steps:

- task: Cache@2
  inputs:
    key: npm | $(Agent.OS) | package-lock.json
    path: $(npm_config_cache)
  displayName: cache npm packages

- task: NodeTool@0
  inputs:
    versionSpec: '24.x'
  displayName: 'install Node.js'

- script: |
    npm i -g @angular/cli@22 --ignore-scripts
    npm ci --ignore-scripts
  displayName: 'install npm packages'

# set-up and run CouchDB in Docker container (used by unit and end-to-end tests)
- task: DownloadSecureFile@1
  displayName: 'download CouchDB local.ini file'
  name: couchdb_local_ini
  inputs:
    secureFile: 'couchdb_local.ini'

- task: PowerShell@2
  displayName: 'copy CouchDB local.ini to target directory'
  inputs:
    targetType: 'inline'
    script: |
      New-Item -Type Directory -Force "${HOME}/couchdb/etc/local.d"
      Copy-Item -Force "$(couchdb_local_ini.secureFilePath)" "${HOME}/couchdb/etc/local.d/local.ini"

- task: DockerInstaller@0
  displayName: install Docker
  inputs:
    dockerVersion: 17.09.0-ce
    releaseType: stable

- script: |
    docker run -p 5984:5984 --name couchdb -v ${HOME}/couchdb/etc/local.d:/opt/couchdb/etc/local.d -d couchdb:3.4.2
  displayName: 'run CouchDB in Docker container'

# perform unit and end-to-end tests and publish their results
- script: |
    npx playwright install --with-deps chromium
  displayName: 'install Playwright Chromium'

- script: |
    CHROME_BIN= npx ng test --configuration=ci
  displayName: 'perform unit tests'

- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'test-results/junit.xml'
  displayName: 'publish unit test results'

- template: e2e/azure-e2e-steps.yml

# build product
- script: |
    npx ng build --configuration production
  failOnStderr: false
  displayName: 'build koia product'
