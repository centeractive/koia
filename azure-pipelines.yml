trigger:
- master

variables:
  npm_config_cache: $(Pipeline.Workspace)/.npm
  NODE_OPTIONS: --max_old_space_size=4096

pool:
  vmImage: 'ubuntu-latest'

# unit and end-to-end tests run in separate jobs, each within the 60 minutes limit of hosted agents
jobs:

- job: unit
  displayName: 'unit tests and build'
  timeoutInMinutes: 60
  steps:

  - template: azure-setup-steps.yml

  # perform unit-tets and publish test and code coverage results
  - script: |
      CHROME_BIN= npx ng test --configuration=ci
    displayName: 'perform unit tests'

  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'test-results/junit.xml'
    displayName: 'publish unit test results'

  - task: PublishCodeCoverageResults@2
    displayName: 'publish code coverage report'
    condition: succeededOrFailed()
    inputs:
      codeCoverageTool: Cobertura
      summaryFileLocation: '$(Build.SourcesDirectory)/coverage/koia/cobertura-coverage.xml'
      failIfCoverageEmpty: false

  # build product and publish artifact
  - script: |
      npx ng build --configuration production
    failOnStderr: false
    displayName: 'build koia product'

  - task: PublishPipelineArtifact@0
    inputs:
      artifactName: 'koiadist'
      targetPath: 'dist/koia'
    enabled: true
    displayName: 'publish artifact'

- job: e2e
  displayName: 'end-to-end tests'
  timeoutInMinutes: 60
  steps:

  - template: azure-setup-steps.yml

  - template: e2e/azure-e2e-steps.yml
